<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- The same policy as the app, so a test that needs a looser one fails here too. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOM tests</title>
  <link rel="stylesheet" href="tests.css">
</head>
<body>
  <h1>DOM tests</h1>
  <p>Sanitizer, tree rewriting and plain text. These need a real DOM, so they run here rather than under <code>npm test</code>.
    Serve the folder (<code>npm start</code>) and open <code>/test/browser/</code>.</p>
  <p id="summary" role="status">Running…</p>
  <ol id="results"></ol>
  <script type="module" src="dom-tests.js"></script>
</body>
</html>
